:root{--ink1:#2b45b5;--ink2:#f3d31a;--paper:#efe8d4;--tx:#15151c;--act:#000;--b:#e6eaf4;--ink1t:#fff}

</style></head><body>
<section id="home"><header><div class="hl"><h1 class="logo">PORTLAB</h1><span class="sub">1. proyectos</span></div><div class="hb"><button id="bn" class="pri">＋ Nuevo proyecto</button><button id="bf">📁 Nueva carpeta</button><button id="bi">Importar respaldo</button><button id="be">Exportar respaldo</button><button id="bd">⬇ Descargar app</button><button id="bth">🎨 Personalizar</button></div></header>

<script>
const $=s=>document.querySelector(s);

const FONTS=['Anton','Bebas Neue','Syne','Bungee','Monoton','Rubik Glitch','UnifrakturCook','Press Start 2P','Arial','Georgia','Courier New'];
const FM=[['Portada cuadrada',3000,3000],['Miniatura YouTube',1280,720],['Portada vertical',1080,1350],['Historia Instagram',1080,1920]];
const PR=['af','lid','pf','rvid','cv','w0','eo','po','pq','fd','hc','hw','inv','iid','win','bd','bdv','shp','thru','bgo','_k','name','col','sc','sw','fx','fxv','_f','_s','lockMovementX','lockMovementY','lockRotation','lockScalingX','lockScalingY','hasControls'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* ---------- IndexedDB ---------- */
const db=new Promise((r,j)=>{const q=indexedDB.open('portlab',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=j});
const tx=async(m,f)=>{const d=await db;return new Promise((r,j)=>{const q=f(d.transaction('p',m).objectStore('p'));q.onsuccess=()=>r(q.result);q.onerror=j})};
const put=p=>tx('readwrite',s=>s.put(p)),all=()=>tx('readonly',s=>s.getAll()),del=id=>tx('readwrite',s=>s.delete(id));
/* ---------- modal ---------- */
const M=h=>{const d=$('#dl');d.innerHTML='<div>'+h+'</div>';d.hidden=0;d.onclick=e=>{if(e.target==d)d.hidden=1}};
/* ---------- inicio ---------- */
let SORT='t',FID=null,MVID=null;try{SORT=localStorage.pl_sort||'t'}catch(e){}
const cr=p=>p.c||parseInt(String(p.id).slice(0,8),36)||0;
let Q='';
async function home(){$('#ed').hidden=1;$('#home').hidden=0;$('#st').textContent='';$('#so').value=SORT;
