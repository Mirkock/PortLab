<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PortLab</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#050507">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Rubik+Glitch&family=UnifrakturCook:wght@700&family=Press+Start+2P&family=Anton&family=Monoton&family=Bungee&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<style>
:root{--bg:#050507;--p:#0f0f16;--l:#2a2a3a;--a:#d4ff00;--ch:linear-gradient(180deg,#fff 0,#9aa4b8 38%,#171b26 50%,#b9c2d6 62%,#fff 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:var(--h,100dvh);background:var(--bg);color:#e6eaf4;font:14px Syne,sans-serif;overflow:hidden}
[hidden]{display:none!important}
.logo{font:34px 'Rubik Glitch',cursive;background:var(--ch);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0;letter-spacing:2px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:#15151f;border:1px solid var(--l);padding:8px 11px;min-height:42px;min-width:42px;border-radius:3px;cursor:pointer}
button:active,button.on{background:var(--a);color:#000;border-color:var(--a)}
input,select,textarea{background:#0a0a10;border:1px solid var(--l);border-radius:3px;padding:8px;width:100%;min-height:40px}
input[type=color]{padding:2px}input[type=range]{padding:0;accent-color:var(--a)}
label{display:block;margin:9px 0 2px;font-size:12px;color:#8e96aa}
h3{margin:0 0 6px;font:18px 'Bebas Neue',sans-serif;letter-spacing:2px;background:var(--ch);-webkit-background-clip:text;background-clip:text;color:transparent}
#home{height:100%;overflow:auto;padding:18px;background:radial-gradient(circle at 80% -10%,#2a2f45,transparent 45%),repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px)}
#home header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}#home header .logo{flex:1;font-size:44px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cd{border:1px solid var(--l);background:var(--p);padding:8px}.cd img{width:100%;aspect-ratio:1;object-fit:contain;background:#000;display:block}
.cd b{display:block;margin:6px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cd small{color:#8e96aa}
.cd div{display:flex;gap:4px;margin-top:6px}.cd button{flex:1;padding:4px;min-width:0}
#ed{height:100%;display:grid;grid-template-columns:84px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr)}
#tools{grid-column:1;grid-row:1}#main{grid-column:2;grid-row:1;min-height:0}#side{grid-column:3;grid-row:1;min-height:0}
#tools{display:flex;flex-direction:column;gap:5px;padding:6px;background:var(--p);border-right:1px solid var(--l);overflow:auto}
#main{overflow:auto;display:flex;min-width:0;background:#08080c;background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:16px 16px}
#wrap{position:relative;margin:auto;line-height:0;box-shadow:0 0 0 1px #6b7385,0 0 40px #000}
#gr{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff4 1px,transparent 1px) 0 0/10% 10%,linear-gradient(90deg,#fff4 1px,transparent 1px) 0 0/10% 10%}
.canvas-container,canvas{touch-action:none}
#side{background:var(--p);border-left:1px solid var(--l);overflow:auto;padding:10px}
.r{display:flex;gap:6px;margin-top:8px}.r>*{flex:1}
.ly{display:flex;gap:3px;align-items:center;border:1px solid var(--l);margin-top:4px;padding:2px 2px 2px 8px}
.ly.sel{border-color:var(--a)}.ly span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ly button{min-width:34px;min-height:34px;padding:2px}
#dl{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}
#dl>div{background:var(--p);border:1px solid #6b7385;padding:16px;width:100%;max-width:380px;max-height:90dvh;overflow:auto}#dl button{margin-top:12px;width:100%}
#st{position:fixed;top:6px;right:10px;font-size:11px;color:var(--a);z-index:5;pointer-events:none}
@media(max-width:800px){
#ed{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 58px}
#main{grid-column:1;grid-row:1}#tools{grid-column:1;grid-row:2}
#tools{flex-direction:row;border:0;border-top:1px solid var(--l);padding:7px}#tools button{flex:0 0 auto}
#side{position:fixed;left:0;right:0;bottom:58px;max-height:calc(var(--h,100dvh)*.45);border-top:1px solid var(--a);transform:translateY(110%);visibility:hidden;transition:transform .2s,visibility .2s;z-index:4}#side.open{transform:none;visibility:visible}
#home header .logo{font-size:34px}}

#tools button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;line-height:1.1;padding:4px;min-height:48px}#tools i{font-style:normal;font-size:18px}
summary{cursor:pointer;padding:10px 0;font:17px 'Bebas Neue',sans-serif;letter-spacing:2px;border-bottom:1px solid var(--l)}details{margin-top:6px}
.ct{margin-top:6px}.ct label{display:flex;justify-content:space-between;align-items:center;margin:4px 0 2px}.rs{min-height:30px;min-width:36px;padding:0;font-size:16px}
.hp{display:block;color:#8e96aa;font-size:11px;line-height:1.35;margin:2px 0 6px}.nohelp .hp,.nohelp #tools span{display:none}
.r{flex-wrap:wrap}.r>button{flex:1 1 45%;font-size:12px}
#gvx,#gvy{position:absolute;pointer-events:none;background:#ff2bd6;z-index:3}#gvx{top:0;bottom:0;width:1px}#gvy{left:0;right:0;height:1px}
@media(max-width:800px){#tools button{min-width:68px}}
</style></head><body>
<div id="st"></div>
<section id="home"><header><h1 class="logo">PORTLAB</h1><button id="bd">⬇ Descargar app</button><button id="bn">＋ Nuevo</button><button id="bi">Importar respaldo</button><button id="be">Exportar respaldo</button></header><div id="grid"></div></section>
<section id="ed" hidden>
<main id="main"><div id="wrap"><canvas id="c"></canvas><div id="gr" hidden></div><div id="gvx" hidden></div><div id="gvy" hidden></div></div></main>
<aside id="side"><div id="pp"></div><h3 style="margin-top:16px">Capas</h3><div id="ly"></div></aside>
<nav id="tools">
<button data-t="home" title="Volver a la lista de proyectos (se guarda solo)"><i>⌂</i><span>Inicio</span></button>
<button data-t="img" title="Subir una foto desde tu dispositivo"><i>▣</i><span>Imagen</span></button>
<button data-t="txt" title="Agregar un texto nuevo"><i>Aa</i><span>Texto</span></button>
<button data-t="tx" title="Agregar una textura: grano, metal, grunge, VHS..."><i>▒</i><span>Textura</span></button>
<button data-t="un" title="Deshacer el último cambio"><i>↶</i><span>Deshacer</span></button>
<button data-t="re" title="Rehacer lo que deshiciste"><i>↷</i><span>Rehacer</span></button>
<button data-t="zo" title="Alejar la vista del lienzo"><i>−</i><span>Alejar</span></button>
<button data-t="zi" title="Acercar la vista del lienzo"><i>＋</i><span>Acercar</span></button>
<button data-t="fit" title="Mostrar el lienzo completo en pantalla"><i>⤢</i><span>Ver todo</span></button>
<button data-t="grid" title="Mostrar u ocultar la cuadrícula (no se exporta)"><i>#</i><span>Cuadrícula</span></button>
<button data-t="sn" class="on" title="Imán: los elementos se pegan a los bordes y al centro del lienzo"><i>⌖</i><span>Imán</span></button>
<button data-t="var" title="Crear una copia de este proyecto para probar otra versión sin perder esta"><i>⎘</i><span>Variación</span></button>
<button data-t="sv" title="Guardar ahora (también se guarda solo)"><i>💾</i><span>Guardar</span></button>
<button data-t="xp" title="Descargar la imagen final en PNG o JPG"><i>⬇</i><span>Exportar</span></button>
<button data-t="hp" title="Mostrar u ocultar las explicaciones y los nombres de los botones"><i>?</i><span>Ayudas</span></button>
<button data-t="pn" id="tp" title="Abrir o cerrar el panel de propiedades y capas"><i>☰</i><span>Panel</span></button>
</nav></section>
<div id="dl" hidden></div>
<input type="file" id="fi" accept="image/*" hidden><input type="file" id="fb" accept=".json" hidden><input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2" hidden>
<script>
const $=s=>document.querySelector(s);
if(!window.fabric)alert('No cargó Fabric.js (¿sin internet?). Reabrí con conexión.');
const FONTS=['Anton','Bebas Neue','Syne','Bungee','Monoton','Rubik Glitch','UnifrakturCook','Press Start 2P','Arial','Georgia','Courier New'];
const FM=[['Portada cuadrada',3000,3000],['Miniatura YouTube',1280,720],['Portada vertical',1080,1350],['Historia Instagram',1080,1920]];
const PR=['bgo','_k','name','col','sc','sw','fx','fxv','_f','_s','lockMovementX','lockMovementY','lockRotation','lockScalingX','lockScalingY','hasControls'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* ---------- IndexedDB ---------- */
const db=new Promise((r,j)=>{const q=indexedDB.open('portlab',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=j});
const tx=async(m,f)=>{const d=await db;return new Promise((r,j)=>{const q=f(d.transaction('p',m).objectStore('p'));q.onsuccess=()=>r(q.result);q.onerror=j})};
const put=p=>tx('readwrite',s=>s.put(p)),all=()=>tx('readonly',s=>s.getAll()),del=id=>tx('readwrite',s=>s.delete(id));
/* ---------- modal ---------- */
const M=h=>{const d=$('#dl');d.innerHTML='<div>'+h+'</div>';d.hidden=0;d.onclick=e=>{if(e.target==d)d.hidden=1}};
/* ---------- inicio ---------- */
async function home(){$('#ed').hidden=1;$('#home').hidden=0;$('#st').textContent='';
const ps=(await all()).filter(p=>p.w).sort((a,b)=>b.t-a.t);
$('#grid').innerHTML=ps.length?ps.map(p=>`<div class=cd data-id=${p.id}><img src="${p.thumb||''}" alt=""><b>${p.name.replace(/</g,'&lt;')}</b><small>${p.w}×${p.h}</small><div><button data-a=o>Abrir</button><button data-a=d title=Duplicar>⎘</button><button data-a=r title=Renombrar>✎</button><button data-a=x title=Eliminar>✕</button></div></div>`).join(''):'<p>No hay proyectos. Creá el primero con “＋ Nuevo”.</p>'}
$('#grid').onclick=async e=>{const a=e.target.dataset.a,c=e.target.closest('.cd');if(!a||!c)return;const ps=await all(),p=ps.find(x=>x.id==c.dataset.id);
if(a=='o')open(p);
if(a=='d'){await put({...p,id:uid(),name:p.name+' (copia)',t:Date.now()});home()}
if(a=='r'){const n=prompt('Nuevo nombre',p.name);if(n){p.name=n;await put(p);home()}}
if(a=='x'&&confirm('¿Eliminar "'+p.name+'"? No se puede deshacer.')){await del(p.id);home()}};
$('#bn').onclick=()=>{M(`<h3>Nuevo proyecto</h3><label>Nombre</label><input id=nn value="Sin título"><label>Formato</label><select id=nf>${FM.map(f=>`<option value="${f[1]},${f[2]}">${f[0]} ${f[1]}×${f[2]}`).join('')}<option value=c>Personalizado</option></select><div class=r id=cu hidden><input id=cw type=number value=1000><input id=ch type=number value=1000></div><button id=nok>Crear</button>`);
$('#nf').onchange=e=>$('#cu').hidden=e.target.value!='c';
$('#nok').onclick=()=>{let v=$('#nf').value,w,h;if(v=='c'){w=+$('#cw').value;h=+$('#ch').value}else[w,h]=v.split(',').map(Number);
const k=x=>Math.max(100,Math.min(4000,x||1000));$('#dl').hidden=1;open({id:uid(),name:$('#nn').value||'Sin título',w:k(w),h:k(h),json:null,thumb:'',t:Date.now()})}};
$('#be').onclick=async()=>{const b=new Blob([JSON.stringify((await all()).filter(p=>p.w))],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='portlab-respaldo.json';a.click()};
$('#bi').onclick=()=>$('#fb').click();
$('#fb').onchange=async e=>{try{const ps=JSON.parse(await e.target.files[0].text());for(const p of ps)if(p.id&&p.w)await put(p);home()}catch(x){alert('Archivo de respaldo inválido')}e.target.value=''};
/* ---------- editor ---------- */
let C,PJ,z=1,H=[],hi=-1,busy=0,tm;
async function open(p){PJ=p;$('#home').hidden=1;$('#ed').hidden=0;
if(!C){C=new fabric.Canvas('c',{preserveObjectStacking:true,selection:true});
fabric.Object.prototype.set({cornerSize:20,touchCornerSize:44,transparentCorners:false,cornerColor:'#d4ff00',borderColor:'#d4ff00',cornerStyle:'circle',padding:4});
['object:added','object:removed','object:modified','text:editing:exited'].forEach(n=>C.on(n,snap));
['selection:created','selection:updated','selection:cleared'].forEach(n=>C.on(n,()=>{pp();L()}));
C.on('text:changed',e=>{refx(e.target)});touch();snapInit()}
await Promise.all(FONTS.map(f=>document.fonts.load('24px "'+f+'"').catch(()=>0)));fabric.charWidthsCache={};
busy=1;C.clear();C.backgroundColor='#0d0d12';
if(p.json)await new Promise(r=>C.loadFromJSON(p.json,r));busy=0;
H=[];hi=-1;snap();fit();pp();L()}
function zoom(n){z=Math.max(.02,Math.min(4,n));C.setZoom(z);C.setDimensions({width:PJ.w*z,height:PJ.h*z});C.requestRenderAll()}
function fit(){const m=$('#main');zoom(Math.min((m.clientWidth-24)/PJ.w,(m.clientHeight-24)/PJ.h))}
addEventListener('resize',()=>{if(C&&!$('#ed').hidden)fit()});
function snap(){if(busy||!PJ)return;H=H.slice(0,hi+1);H.push(JSON.stringify(C.toJSON(PR)));if(H.length>30)H.shift();hi=H.length-1;L();save()}
async function jump(i){if(i<0||i>=H.length)return;hi=i;busy=1;C.discardActiveObject();await new Promise(r=>C.loadFromJSON(H[i],r));busy=0;zoom(z);pp();L();save()}
function save(){$('#st').textContent='guardando…';clearTimeout(tm);tm=setTimeout(flush,700)}
async function flush(){clearTimeout(tm);if(!PJ||!C)return;PJ.json=C.toJSON(PR);PJ.thumb=C.toDataURL({format:'jpeg',quality:.6,multiplier:240/(PJ.w*z)});PJ.t=Date.now();await put(PJ);$('#st').textContent='guardado ✓'}
/* ---------- gestos de dos dedos ---------- */
function touch(){let g;const dd=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),
aa=e=>Math.atan2(e.touches[1].clientY-e.touches[0].clientY,e.touches[1].clientX-e.touches[0].clientX)*180/Math.PI,w=C.wrapperEl;
w.addEventListener('touchstart',e=>{if(e.touches.length==2){const o=C.getActiveObject();g={o:o&&!o.lockMovementX?o:null,d:dd(e),a:aa(e),z,s:o&&o.scaleX,r:o&&o.angle};e.stopPropagation()}},{capture:true,passive:false});
w.addEventListener('touchmove',e=>{if(g&&e.touches.length==2){e.preventDefault();e.stopPropagation();if(g.o){g.o.scale(g.s*dd(e)/g.d);g.o.rotate(g.r+aa(e)-g.a);g.o.setCoords();C.requestRenderAll()}else zoom(g.z*dd(e)/g.d)}},{capture:true,passive:false});
w.addEventListener('touchend',e=>{if(g&&e.touches.length<2){if(g.o)snap();g=null}},true)}
/* ---------- acciones ---------- */
$('#tools').onclick=async e=>{const t=e.target.closest('button')?.dataset.t;if(!t)return;
if(t=='home'){await flush();home()}
if(t=='img')$('#fi').click();
if(t=='txt')addText();
if(t=='un')jump(hi-1);if(t=='re')jump(hi+1);
if(t=='zo')zoom(z*.8);if(t=='zi')zoom(z*1.25);if(t=='fit')fit();
if(t=='grid'){$('#gr').hidden=!$('#gr').hidden;e.target.closest("button").classList.toggle('on',!$('#gr').hidden)}
if(t=='sv'){await flush()}
if(t=='var'){await flush();const n={...PJ,id:uid(),name:PJ.name+' · var',t:Date.now()};await put(n);open(n)}
if(t=='tx')txm();
if(t=='sn'){SN=!SN;e.target.closest('button').classList.toggle('on',SN);gd()}
if(t=='hp'){HP=!HP;try{localStorage.pl_help=HP?1:0}catch(x){}hp()}
if(t=='xp')xp();
if(t=='pn'){$('#side').classList.toggle('open');e.target.closest("button").classList.toggle('on')}};
document.addEventListener('keydown',e=>{if($('#ed').hidden||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const o=C.getActiveObject();
if((e.key=='Delete'||e.key=='Backspace')&&o&&!o.isEditing){C.remove(o);C.discardActiveObject()}
if(e.ctrlKey&&e.key=='z'){e.preventDefault();jump(hi-1)}if(e.ctrlKey&&e.key=='y'){e.preventDefault();jump(hi+1)}});
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();im.onload=()=>{
const k=Math.min(1,2048/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
const u=c.toDataURL(f.type=='image/png'?'image/png':'image/jpeg',.9);URL.revokeObjectURL(im.src);
fabric.Image.fromURL(u,o=>{o.scaleToWidth(PJ.w*.7);o.set({left:PJ.w/2,top:PJ.h/2,originX:'center',originY:'center',name:'Imagen',_f:{},_s:{}});C.add(o);C.setActiveObject(o)})};
im.onerror=()=>alert('No se pudo leer la imagen');im.src=URL.createObjectURL(f)};
function addText(){const t=new fabric.Textbox('TEXTO',{left:PJ.w/2,top:PJ.h/2,originX:'center',originY:'center',width:PJ.w*.6,fontSize:PJ.w*.08,fontFamily:'Anton',textAlign:'center',col:'#ffffff',fx:'normal',fxv:50,name:'Texto'});fx(t,'normal');C.add(t);C.setActiveObject(t)}
/* ---------- efectos de texto ---------- */
function font(t,f){document.fonts.load('24px "'+f+'"').then(()=>{fabric.charWidthsCache={};t.set('fontFamily',f);t.initDimensions();fx(t,t.fx);C.requestRenderAll();snap()})}
function refx(o){if(o&&o.type=='textbox')fx(o,o.fx||'normal')}
function fx(t,n,v){t.fx=n;if(v!=null)t.fxv=+v;v=t.fxv||50;const k=v/50,s=t.fontSize,c=t.col||'#ffffff',
g=(...st)=>new fabric.Gradient({type:'linear',coords:{x1:0,y1:0,x2:0,y2:t.height},colorStops:st.map((x,i)=>({offset:i/(st.length-1),color:x}))}),
sh=(co,b,x=0,y=0)=>t.shadow=new fabric.Shadow({color:co,blur:b,offsetX:x,offsetY:y});
t.set({fill:c,stroke:t.sc||null,strokeWidth:t.sw||0,shadow:null});
if(n=='chrome'){t.set({fill:g('#ffffff','#9aa4b8','#161a24','#c3cbe0','#ffffff'),stroke:'#0a0c12',strokeWidth:s*.012*k});sh('rgba(160,190,255,.55)',12*k)}
if(n=='blood'){t.set({fill:g('#ff4d3d','#c00000','#3a0000'),stroke:'#1a0000',strokeWidth:s*.01*k});sh('#7a0000',14*k,0,5*k)}
if(n=='glow')sh(c,35*k);
if(n=='outline')t.set({fill:'rgba(0,0,0,0)',stroke:c,strokeWidth:Math.max(1,s*.025*k)});
if(n=='glitch'){sh('#00f0ff',0,8*k,0);t.set({stroke:'#ff0044',strokeWidth:s*.008*k})}
if(n=='3d')sh('#8a8f9c',0,5*k,5*k);
t.dirty=true}
/* ---------- panel de propiedades ---------- */
const BM=[['source-over','Normal'],['multiply','Multiplicar (oscurece)'],['screen','Trama (aclara)'],['overlay','Superponer (más contraste)'],['soft-light','Luz suave'],['hard-light','Luz intensa'],['difference','Diferencia (invierte colores)'],['exclusion','Exclusión'],['color-dodge','Sobreexponer'],['darken','Solo lo más oscuro'],['lighten','Solo lo más claro']];
const HELP={op:'Qué tan visible es la capa: 100 = sólida, 0 = invisible.',an:'Gira la capa. También podés girarla con la manija del lienzo o con dos dedos.',bm:'Cómo se mezcla esta capa con lo que tiene detrás (fotos, texturas, fondo). Probá Superponer o Multiplicar para integrar un texto o una textura a la foto.',
sz:'Tamaño de las letras, en píxeles del lienzo.',col:'Color principal del texto.',sp:'Separación entre letras. Negativo = más juntas.',lh:'Separación entre renglones (altura de línea).',al:'Cómo se alinea el texto dentro de su caja.',sc:'Color del borde de las letras.',sw:'Grosor del borde de las letras. 0 = sin borde.',
fx:'Efecto especial. CHROME: metal cromado. BLOOD: rojo oscuro. GLITCH: copia desplazada. GLOW: brillo. OUTLINE: solo contorno. 3D: sombra dura que da volumen. PIXEL y GOTHIC cambian la fuente.',fv:'Qué tan fuerte se ve el efecto elegido.',
